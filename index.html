<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login_Form_project</title>

    <style>
        * {
            font-family: Georgia, 'Times New Roman', Times, serif;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUu2Jaz907tTu6i0PipYgDqHNGQ17tJasAzy3B05N_fnqYEYR3Svg9N-Y&s=10");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .maincontainer {
            width: 90%;
            max-width: 450px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
        }

        .navbar nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 45px;
            width: 100%;
            margin-bottom: 60px;
        }

        .navbar a {
            color: burlywood;
            font-weight: 500;
            font-size: 18px;
        }

        .prfl {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid white;
            object-fit: cover;
            background-color: burlywood;
        }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            justify-content: center;
            color: burlywood;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .form-group ::placeholder {
            color: rgb(155, 154, 149);
        }

        .form-group label {
            display: inline-block;
            width: 100px;
            padding: 5px 5px 5px 0;
        }

        .form-group input {
            border: none;
            border-bottom: 1px solid white;
            outline: none;
            width: 100%;
            max-width: 200px;
            background: transparent;
            padding: 5px;
            color: white;
            font-size: 18px;
        }

        .login_button {
            width: 100%;
            max-width: 350px;
            height: 40px;
            background: burlywood;
            color: rgb(28, 17, 59);
            font-size: 18px;
            box-shadow: 4px 4px 0 rgb(187, 130, 90);
        }

        .cancel_button {
            margin: 20px;
            width: 100%;
            max-width: 350px;
            height: 40px;
            background: burlywood;
            color: rgb(28, 17, 59);
            font-size: 18px;
            box-shadow: 4px 4px 0 rgb(187, 130, 90);
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .maincontainer {
                width: 100%;
                max-width: 400px;
                margin: 10px auto;
                padding: 15px;
            }

            /* Smaller gap between navigation items */
            .navbar nav {
                gap: 20px;
                margin-bottom: 40px;
            }

            .navbar a {
                font-size: 16px;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 30px;
            }

            .prfl {
                width: 120px;
                height: 120px;
                border-width: 6px;
                margin-bottom: 25px;
            }

            .form-group {
                justify-content: flex-start;
            }

            .form-group label {
                width: 90px;
                font-size: 16px;
            }

            .form-group input {
                flex: 1;
                width: auto;
                max-width: none;
                font-size: 16px;
            }

            /* Buttons fit the screen */
            .login_button,
            .cancel_button {
                width: 100%;
                max-width: none;
            }

            .remember {
                margin: 18px 0;
            }

            .forgot {
                display: inline-block;
                margin: 15px 0;
            }
        }

        /*Small screens*/
        @media (max-width: 400px) {
            body {
                padding: 5px;
            }

            .maincontainer {
                padding: 10px;
            }

            .navbar nav {
                gap: 12px;
                margin-bottom: 30px;
            }

            .navbar a {
                font-size: 14px;
            }

            h1 {
                font-size: 24px;
            }

            .prfl {
                width: 100px;
                height: 100px;
                margin-bottom: 20px;
            }

            .form-group {
                display: block;
                text-align: left;
                margin-bottom: 18px;
            }

            .form-group label {
                display: block;
                width: 100%;
                margin-bottom: 5px;
            }

            .form-group input {
                width: 100%;
            }

            .login_button,
            .cancel_button {
                height: 42px;
                font-size: 16px;
            }
        }

        .remember {
            margin: 20px;
            color: burlywood;
        }

        .forgot {
            margin: 20px;
            color: burlywood;
        }
    </style>
</head>

<body>

    <div class="maincontainer">

        <div class="navbar">
            <nav>
                <a href="#">Home</a>
                <a href="#">Services</a>
                <a href="#">Products</a>
                <a href="#">Contact us</a>
            </nav>
        </div>

        <h1 style="color: burlywood; margin-bottom: 40px;">
            Login Form
        </h1>

        <img src="https://ik.imagekit.io/d9mvewbju/Course/BigbinaryAcademy/profile-image-css-login-page-project_tS9W4AV3q.png"
            alt="profile_pic" class="prfl" style="margin-bottom: 30px;">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" placeholder="Enter Username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" placeholder="Enter Password">
        </div>

        <button class="login_button">Login</button>

        <div class="remember">
            <input type="checkbox" id="check">
            <label for="check">Remember me</label>
        </div>

        <a href="#" class="forgot">Forgot Password</a>

        <br>

        <button class="cancel_button">Cancel</button>

    </div>

</body>

</html>
